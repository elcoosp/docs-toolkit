# ============================================================================
# Canonical git-cliff configuration — elcoosp docs fleet.
# THIS IS THE ONLY COPY. No per-repo cliff.toml.
#
# Usage:
#   CI:   see .github/workflows/changelog.yml (reusable workflow)
#   Local: export GIT_CLIFF_CONFIG_URL=<raw-url> && git cliff ...
# ============================================================================

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{% endfor %}\
{% endfor %}\n"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
topo_order = false
sort_commits = "newest"

# Strip gitmoji / Unicode emoji from commit messages (both actual emoji and :shortcode:)
commit_preprocessors = [
  { pattern = ' *(:\w+:|[\p{Emoji_Presentation}\p{Extended_Pictographic}](?:\u{FE0F})?\u{200D}?)*', replace = "" },
]

# Ordered groups via HTML comments; template strips them with `striptags`
commit_parsers = [
  { message = "^feat", group = "<!-- 0 --> Features" },
  { message = "^fix", group = "<!-- 1 --> Bug Fixes" },
  { message = "^perf", group = "<!-- 2 --> Performance" },
  { message = "^refactor", group = "<!-- 3 --> Refactor" },
  { message = "^doc", group = "<!-- 4 --> Documentation" },
  { message = "^test", group = "<!-- 5 --> Testing" },
  { message = "^ci", group = "<!-- 6 --> CI" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps\\)", group = "<!-- 7 --> Dependencies" },
  { message = "^chore", group = "<!-- 8 --> Miscellaneous" },
  { message = "^revert", group = "<!-- 9 --> Revert" },
]

tag_pattern = "v[0-9]*"
skip_tags = ""
ignore_tags = ""

[remote.github]
owner = "elcoosp"

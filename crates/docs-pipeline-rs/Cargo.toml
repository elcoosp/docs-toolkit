[package]
name = "docs-pipeline-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
aho-corasick = "1.1.5"
jwalk = "0.9.0"
lol_html = "3.0.3"
pulldown-cmark = "0.13"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
rayon = "1.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tl = "0.7.8"
tree-sitter = "0.27.2"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

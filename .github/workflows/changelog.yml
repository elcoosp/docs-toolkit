# Reusable changelog workflow for the elcoosp docs fleet.
# Callers see templates/changelog.yml (additive) and
# templates/changelog-with-release.yml (standalone).
#
# mode:
#   'changelog-only' (default) — regenerate CHANGELOG.md + commit; no release
#   'release'                  — also create GitHub release from the changelog
#   'check'                    — fail if CHANGELOG.md is stale (PR gate)

on:
  workflow_call:
    inputs:
      mode:
        description: "'changelog-only' | 'release' | 'check'"
        type: string
        default: 'changelog-only'
      config_url:
        description: 'Raw URL to canonical cliff.toml'
        type: string
        default: 'https://raw.githubusercontent.com/elcoosp/docs-toolkit/main/git-cliff/cliff.toml'
      changelog_path:
        description: 'Path to CHANGELOG.md relative to repo root'
        type: string
        default: 'CHANGELOG.md'
    secrets:
      token:
        required: false
        description: 'GitHub token (defaults to github.token)'

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    name: Generate changelog (${{ inputs.mode }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.token || github.token }}

      - uses: taiki-e/install-action@git-cliff

      - name: Fetch canonical config
        run: curl -fsSL "${{ inputs.config_url }}" -o /tmp/cliff.toml

      - name: Generate changelog
        if: inputs.mode != 'check'
        run: |
          git cliff --config /tmp/cliff.toml --tag "$GITHUB_REF_NAME" -o "${{ inputs.changelog_path }}"

      - name: Generate release notes
        if: inputs.mode == 'release'
        run: |
          git cliff --config /tmp/cliff.toml --latest --strip header > /tmp/release_notes.md

      - name: Check freshness
        if: inputs.mode == 'check'
        run: |
          git cliff --config /tmp/cliff.toml --tag "$GITHUB_REF_NAME" -o /tmp/expected.md
          diff -q "${{ inputs.changelog_path }}" /tmp/expected.md || {
            echo "::error::CHANGELOG.md is stale — run git cliff locally"
            exit 1
          }

      - name: Commit
        if: inputs.mode != 'check'
        run: |
          if git diff --quiet "${{ inputs.changelog_path }}"; then
            echo "No changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "${{ inputs.changelog_path }}"
            git commit -m "chore(release): update changelog for $GITHUB_REF_NAME"
            git push
          fi

      - name: Create GitHub Release
        if: inputs.mode == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: /tmp/release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.token || github.token }}

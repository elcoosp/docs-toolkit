name: Rust Release

on:
  workflow_call:
    inputs:
      publish:
        description: 'Publish workspace crates to crates.io'
        type: boolean
        default: true
      binary_targets:
        description: 'JSON array of target triples to build and attach to release. Empty = no binaries'
        type: string
        default: '[]'
      binary_name:
        description: 'Binary name (defaults to repo name)'
        type: string
        default: ''
      extra_checks:
        description: 'JSON array: verify-tag, fmt, clippy, test'
        type: string
        default: '["verify-tag","fmt","clippy","test"]'
      dry_run:
        description: 'Validation only — no publish, no release'
        type: boolean
        default: false
      config_url:
        description: 'Canonical cliff.toml URL'
        type: string
        default: 'https://raw.githubusercontent.com/elcoosp/docs-toolkit/main/git-cliff/cliff.toml'
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: false
      GH_TOKEN:
        required: false

permissions:
  contents: write
  id-token: write

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      matrix: ${{ steps.m.outputs.matrix }}
      has_binaries: ${{ steps.m.outputs.has_binaries }}
      checks: ${{ inputs.extra_checks }}
      do_publish: ${{ steps.f.outputs.do_publish }}
      do_release: ${{ steps.f.outputs.do_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Resolve version
        id: v
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ inputs.dry_run }}" == "false" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH"
              exit 1
            fi
            V="${GITHUB_REF_NAME#v}"
            C=$(grep -m1 '^version' Cargo.toml | sed 's/version = "//;s/"//')
            if [[ "$V" != "$C" ]]; then
              echo "::error::Tag $V != Cargo.toml $C"
              exit 1
            fi
            echo "version=$V" >> "$GITHUB_OUTPUT"
          else
            C=$(grep -m1 '^version' Cargo.toml | sed 's/version = "//;s/"//')
            echo "version=$C" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binary matrix
        id: m
        run: |
          T='${{ inputs.binary_targets }}'
          if [[ "$T" == "[]" || -z "$T" ]]; then
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            echo "has_binaries=false" >> "$GITHUB_OUTPUT"
          else
            M=$(echo "$T" | jq -c '[.[] | {
              target: .,
              os: (if . == "x86_64-apple-darwin" then "macos-13"
                   elif . == "aarch64-apple-darwin" then "macos-latest"
                   elif . == "x86_64-pc-windows-msvc" then "windows-latest"
                   else "ubuntu-latest" end),
              cross: (if . == "aarch64-unknown-linux-gnu" then true else false end)
            }]')
            echo "matrix=$M" >> "$GITHUB_OUTPUT"
            echo "has_binaries=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve flags
        id: f
        run: |
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            echo "do_publish=false" >> "$GITHUB_OUTPUT"
            echo "do_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "do_publish=${{ inputs.publish }}" >> "$GITHUB_OUTPUT"
            echo "do_release=true" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Checks
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        if: contains(fromJSON(needs.plan.outputs.checks), 'fmt')
        run: cargo fmt --all -- --check
      - name: clippy
        if: contains(fromJSON(needs.plan.outputs.checks), 'clippy')
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        if: contains(fromJSON(needs.plan.outputs.checks), 'test')
        run: cargo test --workspace --locked

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.has_binaries == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        if: matrix.cross
        with:
          tool: cross
      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} --locked
      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }} --locked
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          NAME='${{ inputs.binary_name }}'
          [[ -z "$NAME" ]] && NAME=$(basename "${{ github.repository }}")
          cd "target/${{ matrix.target }}/release"
          tar czf "$NAME-${{ matrix.target }}.tar.gz" "$NAME"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          NAME='${{ inputs.binary_name }}'
          [[ -z "$NAME" ]] && NAME=$(basename "${{ github.repository }}")
          cd "target/${{ matrix.target }}/release"
          7z a "$NAME-${{ matrix.target }}.zip" "$NAME.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ github.event.repository.name }}-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/*.tar.gz
            target/${{ matrix.target }}/release/*.zip
          if-no-files-found: error

  publish:
    name: Publish crates
    needs: [plan, checks]
    if: needs.plan.outputs.do_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dry-run publish
        run: cargo publish --workspace --locked --dry-run
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --locked

  changelog:
    name: Changelog
    needs: plan
    if: needs.plan.outputs.do_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || github.token }}
      - uses: taiki-e/install-action@git-cliff
      - name: Fetch canonical cliff.toml
        run: curl -fsSL '${{ inputs.config_url }}' -o /tmp/cliff.toml
      - name: Generate CHANGELOG + release notes
        run: |
          git cliff --config /tmp/cliff.toml --tag "$GITHUB_REF_NAME" -o CHANGELOG.md
          git cliff --config /tmp/cliff.toml --latest --strip header > /tmp/release-notes.md
      - name: Commit CHANGELOG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet CHANGELOG.md; then
            git add CHANGELOG.md
            git commit -m "chore(release): update changelog for $GITHUB_REF_NAME"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: /tmp/release-notes.md

  release:
    name: GitHub release
    needs: [plan, changelog, build-binaries]
    if: |
      always() &&
      needs.plan.outputs.do_release == 'true' &&
      needs.changelog.result == 'success' &&
      (needs.build-binaries.result == 'success' || needs.build-binaries.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.has_binaries == 'true'
        with:
          pattern: 'binary-*'
          merge-multiple: true
          path: /tmp/assets
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: /tmp/notes
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: /tmp/notes/release-notes.md
          files: /tmp/assets/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

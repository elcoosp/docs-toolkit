name: Release (release-plz)

# Reusable release-plz workflow.
#
# dry_run semantics (matches the official release-plz GitHub Action):
#   - release-pr job: runs `release-plz update` (modifies files locally,
#     no PR opened). Print diff as the preview. release-pr has no --dry-run.
#   - release job:   runs `release-plz release --dry-run` (supported flag).
#
# Config fetched at runtime from docs-toolkit — zero per-repo config files.

on:
  workflow_call:
    inputs:
      config_url:
        description: 'Canonical release-plz.toml URL'
        type: string
        default: 'https://raw.githubusercontent.com/elcoosp/docs-toolkit/main/release-plz.toml'
      dry_run:
        description: 'Preview only (no PR, no publish, no tag)'
        type: boolean
        default: false
    secrets:
      RELEASE_PLZ_TOKEN:
        required: false
        description: 'PAT (contents+pull-requests write). Required for binary repos so `release: published` fires binaries.yml.'
      CARGO_REGISTRY_TOKEN:
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    name: Release PR
    runs-on: ubuntu-24.04
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: release-plz
      - name: Fetch canonical config (via GitHub API)
        env:
          CONFIG_URL: ${{ inputs.config_url }}
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # raw.githubusercontent.com caches by path — /main/ can serve stale.
          # gh api hits the repo API directly: no CDN cache, always current.
          STRIPPED="${CONFIG_URL#https://raw.githubusercontent.com/}"
          REPO_PATH=$(echo "$STRIPPED" | awk -F'/' '{print $1"/"$2}')
          FILE_PATH=$(echo "$STRIPPED" | awk -F'/' '{for(i=4;i<=NF;i++) printf "%s%s", (i>4?"/":""), $i}')
          echo "  repo: $REPO_PATH  file: $FILE_PATH  ref: main"
          gh api "repos/$REPO_PATH/contents/$FILE_PATH?ref=main" \
            -H "Accept: application/vnd.github.raw" > /tmp/release-plz.toml
          echo "  config lines: $(wc -l < /tmp/release-plz.toml)"
          if grep -qE '^\s*footer\s*=' /tmp/release-plz.toml; then
            echo "::error::config contains unsupported 'footer' key"
            exit 1
          fi
      - name: Preview (release-plz update — no PR)
        if: inputs.dry_run == true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          release-plz update -vv --config /tmp/release-plz.toml
          echo "::group::git diff"
          git --no-pager diff
          echo "::endgroup::"
          echo "::notice::dry_run — no PR opened, no commit made"
      - name: release-plz release-pr
        if: inputs.dry_run == false
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
        run: release-plz release-pr -vv --config /tmp/release-plz.toml --forge github --git-token "$GH_TOKEN"

  release:
    name: Release
    runs-on: ubuntu-24.04
    concurrency:
      group: release-plz-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: release-plz
      - name: Fetch canonical config (via GitHub API)
        env:
          CONFIG_URL: ${{ inputs.config_url }}
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # raw.githubusercontent.com caches by path — /main/ can serve stale.
          # gh api hits the repo API directly: no CDN cache, always current.
          STRIPPED="${CONFIG_URL#https://raw.githubusercontent.com/}"
          REPO_PATH=$(echo "$STRIPPED" | awk -F'/' '{print $1"/"$2}')
          FILE_PATH=$(echo "$STRIPPED" | awk -F'/' '{for(i=4;i<=NF;i++) printf "%s%s", (i>4?"/":""), $i}')
          echo "  repo: $REPO_PATH  file: $FILE_PATH  ref: main"
          gh api "repos/$REPO_PATH/contents/$FILE_PATH?ref=main" \
            -H "Accept: application/vnd.github.raw" > /tmp/release-plz.toml
          echo "  config lines: $(wc -l < /tmp/release-plz.toml)"
          if grep -qE '^\s*footer\s*=' /tmp/release-plz.toml; then
            echo "::error::config contains unsupported 'footer' key"
            exit 1
          fi
      - name: release-plz release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=(release --config /tmp/release-plz.toml)
          if [[ "$DRY_RUN" == "true" ]]; then ARGS+=(--dry-run); fi
          release-plz "${ARGS[@]}"

name: Release (release-plz)

# Reusable release-plz workflow.
# dry_run semantics: release-pr runs `release-plz update` (local preview);
# release runs `release-plz release --dry-run`.

on:
  workflow_call:
    inputs:
      config_url:
        description: 'Canonical release-plz.toml URL'
        type: string
        default: 'https://raw.githubusercontent.com/elcoosp/docs-toolkit/main/release-plz.toml'
      dry_run:
        description: 'Preview only (no PR, no publish, no tag)'
        type: boolean
        default: false
    secrets:
      GH_TOKEN:
        required: true
        description: 'GitHub token (contents+pull-requests write).'
      CARGO_REGISTRY_TOKEN:
        required: false
        description: 'crates.io token. Required for real releases; not for dry-run.'

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    name: Release PR
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    timeout-minutes: 15
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: release-plz
      - name: Fetch canonical config (via GitHub API)
        env:
          CONFIG_URL: ${{ inputs.config_url }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          RUST_LOG: info,release_plz_core=debug
        run: |
          STRIPPED="${CONFIG_URL#https://raw.githubusercontent.com/}"
          REPO_PATH=$(echo "$STRIPPED" | awk -F'/' '{print $1"/"$2}')
          FILE_PATH=$(echo "$STRIPPED" | awk -F'/' '{for(i=4;i<=NF;i++) printf "%s%s", (i>4?"/":""), $i}')
          echo "  repo: $REPO_PATH  file: $FILE_PATH  ref: main"
          gh api "repos/$REPO_PATH/contents/$FILE_PATH?ref=main" \
            -H "Accept: application/vnd.github.raw" > /tmp/release-plz.toml
          echo "  config lines: $(wc -l < /tmp/release-plz.toml)"
          if grep -qE '^\s*footer\s*=' /tmp/release-plz.toml; then
            echo "::error::config contains unsupported 'footer' key"
            exit 1
          fi
      - name: Preview (release-plz update — no PR)
        if: inputs.dry_run == true
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          RUST_LOG: info,release_plz_core=debug
        run: |
          release-plz update --config /tmp/release-plz.toml --forge github --git-token "$GH_TOKEN"
          echo "::group::git diff"
          git --no-pager diff
          echo "::endgroup::"
          echo "::notice::dry_run — no PR opened, no commit made"
      - name: release-plz release-pr
        if: inputs.dry_run == false
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: release-plz release-pr --config /tmp/release-plz.toml --forge github --git-token "$GH_TOKEN"

  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    timeout-minutes: 15
    concurrency:
      group: release-plz-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: release-plz
      - name: Fetch canonical config (via GitHub API)
        env:
          CONFIG_URL: ${{ inputs.config_url }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          RUST_LOG: info,release_plz_core=debug
        run: |
          STRIPPED="${CONFIG_URL#https://raw.githubusercontent.com/}"
          REPO_PATH=$(echo "$STRIPPED" | awk -F'/' '{print $1"/"$2}')
          FILE_PATH=$(echo "$STRIPPED" | awk -F'/' '{for(i=4;i<=NF;i++) printf "%s%s", (i>4?"/":""), $i}')
          gh api "repos/$REPO_PATH/contents/$FILE_PATH?ref=main" \
            -H "Accept: application/vnd.github.raw" > /tmp/release-plz.toml
      - name: release-plz release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RUST_LOG: info,release_plz_core=debug
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=(release --config /tmp/release-plz.toml --forge github --git-token "$GH_TOKEN")
          if [[ "$DRY_RUN" == "true" ]]; then ARGS+=(--dry-run); fi
          release-plz "${ARGS[@]}"

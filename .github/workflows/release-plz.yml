name: Release (release-plz)

# Reusable release-plz workflow.
# dry_run semantics: release-pr runs `release-plz update` (local preview);
# release runs `release-plz release --dry-run`.

on:
  workflow_call:
    inputs:
      config_url:
        description: 'Canonical release-plz.toml URL'
        type: string
        default: 'https://raw.githubusercontent.com/elcoosp/docs-toolkit/main/release-plz.toml'
      dry_run:
        description: 'Preview only (no PR, no publish, no tag)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-pr:
    name: Release PR
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: release-plz
      - name: Fetch canonical config (via GitHub API)
        env:
          CONFIG_URL: ${{ inputs.config_url }}
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          STRIPPED="${CONFIG_URL#https://raw.githubusercontent.com/}"
          REPO_PATH=$(echo "$STRIPPED" | awk -F'/' '{print $1"/"$2}')
          FILE_PATH=$(echo "$STRIPPED" | awk -F'/' '{for(i=4;i<=NF;i++) printf "%s%s", (i>4?"/":""), $i}')
          echo "  repo: $REPO_PATH  file: $FILE_PATH  ref: main"
          gh api "repos/$REPO_PATH/contents/$FILE_PATH?ref=main" \
            -H "Accept: application/vnd.github.raw" > /tmp/release-plz.toml
          echo "  config lines: $(wc -l < /tmp/release-plz.toml)"
      - name: Preview (config + version check only)
        if: inputs.dry_run == true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          echo "── config lines: $(wc -l < /tmp/release-plz.toml)"
          echo "── workspace members:"
          cargo metadata --no-deps --format-version 1 2>/dev/null | \
            jq -r '.packages[] | "  \(.name) \(.version)"'
          echo "::notice::dry_run — config valid, workspace readable, no PR opened"
      - name: release-plz release-pr
        if: inputs.dry_run == false
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          RUST_LOG: info,release_plz_core=debug
        run: release-plz release-pr --config /tmp/release-plz.toml --forge github --git-token "$GH_TOKEN"

  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: release-plz-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: release-plz
      - name: Fetch canonical config (via GitHub API)
        env:
          CONFIG_URL: ${{ inputs.config_url }}
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          STRIPPED="${CONFIG_URL#https://raw.githubusercontent.com/}"
          REPO_PATH=$(echo "$STRIPPED" | awk -F'/' '{print $1"/"$2}')
          FILE_PATH=$(echo "$STRIPPED" | awk -F'/' '{for(i=4;i<=NF;i++) printf "%s%s", (i>4?"/":""), $i}')
          gh api "repos/$REPO_PATH/contents/$FILE_PATH?ref=main" \
            -H "Accept: application/vnd.github.raw" > /tmp/release-plz.toml
      - name: release-plz release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          RUST_LOG: info,release_plz_core=debug
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=(release --config /tmp/release-plz.toml --forge github --git-token "$GH_TOKEN")
          if [[ "$DRY_RUN" == "true" ]]; then ARGS+=(--dry-run); fi
          release-plz "${ARGS[@]}"

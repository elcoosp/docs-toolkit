# ============================================================================
# Canonical release-plz configuration — elcoosp docs fleet.
# THIS IS THE ONLY COPY. Consumers fetch it at runtime via release-plz.yml.
#
# - Version computation: SemVer from conventional commits + cargo-semver-checks
# - Changelog: generated by release-plz (git-cliff as a library, Tera engine)
# - Tag + crates.io publish + GitHub release: all owned by release-plz
# - Binary build/attach: separate binaries.yml workflow (see docs-toolkit)
# ============================================================================

[workspace]
git_release_enable   = true
git_tag_enable       = true
git_tag_name         = "v{{ version }}"
pr_labels            = ["release"]
semver_check = false  # disabled: many packages have never been published to crates.io
dependencies_update  = false
release_always       = false
git_only             = true   # use git tags as version baseline, not crates.io

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}\
- {% if commit.remote.pr_title -%}
    {%- set commit_message = commit.remote.pr_title -%}
  {%- else -%}
    {%- set commit_message = commit.message | split(pat="\n") | first | trim -%}
  {%- endif -%}
  {{ commit_message }}{% if commit.remote.username %} by @{{ commit.remote.username }}{% endif %}{% if commit.remote.pr_number %} in [#{{ commit.remote.pr_number }}]({{ remote.link }}/pull/{{ commit.remote.pr_number }}){% endif %} ([{{ commit.id | truncate(length=7, end="") }}]({{ remote.link }}/commit/{{ commit.id }}))
{% endfor %}\
{% endfor %}\
{% if remote.contributors | filter(attribute="is_first_time", value=true) | length != 0 -%}
### New Contributors
{% for contributor in remote.contributors | filter(attribute="is_first_time", value=true) %}
- @{{ contributor.username }} made their first contribution in [#{{ contributor.pr_number }}]({{ remote.link }}/pull/{{ contributor.pr_number }})
{% endfor %}\
{% endif -%}
{% if release_link -%}
**Full Changelog**: {{ release_link }}
{% endif -%}
"""
trim = true

commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^doc", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^ci", group = "CI" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps\\)", group = "Dependencies" },
  { message = "^chore", group = "Miscellaneous" },
  { message = "^revert", group = "Revert" },
]
